<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ResumeAI — Instant Resume Tailoring</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ── Sidebar ── -->
  <aside class="sidebar" id="sidebar" aria-label="Resume panel">
    <div class="sidebar-inner">

      <div class="sidebar-logo">
        <span class="logo-name">ResumeAI</span>
        <span class="logo-badge">Free, runs in your browser</span>
      </div>

      <section class="sidebar-section" aria-labelledby="resume-heading">
        <h2 class="section-label" id="resume-heading">My Resume</h2>
        <textarea
          id="resume-textarea"
          class="sidebar-textarea"
          placeholder="Paste your resume text here, or upload a PDF below…"
          spellcheck="false"
          aria-label="Resume text"
        ></textarea>
        <div class="resume-actions">
          <button id="upload-btn" class="btn btn-sm btn-secondary" type="button" aria-label="Upload PDF resume">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="17 8 12 3 7 8"/>
              <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
            Upload PDF
          </button>
          <input type="file" id="file-input" accept=".pdf" class="visually-hidden" tabindex="-1" aria-label="PDF file input">
          <button id="save-btn" class="btn btn-sm btn-secondary" type="button">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
              <polyline points="17 21 17 13 7 13 7 21"/>
              <polyline points="7 3 7 8 15 8"/>
            </svg>
            Save
          </button>
          <button id="clear-btn" class="btn btn-sm btn-ghost btn-danger" type="button">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <polyline points="3 6 5 6 21 6"/>
              <path d="M19 6l-1 14H6L5 6"/>
              <path d="M10 11v6M14 11v6"/>
              <path d="M9 6V4h6v2"/>
            </svg>
            Clear
          </button>
        </div>
      </section>

      <footer class="sidebar-footer">
        <p class="footer-note">No AI model. No data sent anywhere. Instant results.</p>
      </footer>

    </div>
  </aside>

  <!-- ── Main content ── -->
  <main class="main">

    <button class="hamburger-btn" id="hamburger-btn" type="button" aria-label="Toggle sidebar" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>

    <div class="main-inner">

      <section class="jd-section" aria-labelledby="jd-label">
        <label class="field-label" for="jd-textarea" id="jd-label">Job Description</label>
        <textarea
          id="jd-textarea"
          class="jd-textarea"
          placeholder="Paste the full job advertisement here"
          spellcheck="true"
          aria-label="Job description"
        ></textarea>
      </section>

      <div class="action-row">
        <button
          id="generate-btn"
          class="btn btn-primary btn-generate"
          type="button"
          disabled
          aria-label="Tailor my application"
        >
          Tailor My Application
        </button>
      </div>

      <div id="error-area" class="error-area" hidden role="alert" aria-live="assertive">
        <div class="error-content">
          <span id="error-message" class="error-message"></span>
        </div>
        <div class="error-actions">
          <button id="error-dismiss" class="btn-dismiss" type="button" aria-label="Dismiss error">&#x2715;</button>
        </div>
      </div>

      <div id="output-area" class="output-area" hidden>

        <article class="output-card" aria-labelledby="resume-card-title">
          <div class="card-header">
            <h2 class="card-title" id="resume-card-title">Tailored Resume</h2>
            <div class="card-actions">
              <button id="resume-copy" class="btn btn-sm btn-secondary" type="button" aria-label="Copy resume">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                  <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                  <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                </svg>
                Copy
              </button>
              <button id="resume-download" class="btn btn-sm btn-secondary" type="button" aria-label="Download resume as text file">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                  <polyline points="7 10 12 15 17 10"/>
                  <line x1="12" y1="15" x2="12" y2="3"/>
                </svg>
                Download .txt
              </button>
            </div>
          </div>
          <pre id="resume-output" class="output-pre" aria-label="Tailored resume"></pre>
        </article>

        <article class="output-card" aria-labelledby="cover-card-title">
          <div class="card-header">
            <h2 class="card-title" id="cover-card-title">Cover Letter</h2>
            <div class="card-actions">
              <button id="cover-copy" class="btn btn-sm btn-secondary" type="button" aria-label="Copy cover letter">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                  <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                  <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                </svg>
                Copy
              </button>
              <button id="cover-download" class="btn btn-sm btn-secondary" type="button" aria-label="Download cover letter as text file">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                  <polyline points="7 10 12 15 17 10"/>
                  <line x1="12" y1="15" x2="12" y2="3"/>
                </svg>
                Download .txt
              </button>
            </div>
          </div>
          <pre id="cover-output" class="output-pre" aria-label="Cover letter"></pre>
        </article>

      </div><!-- /output-area -->

    </div><!-- /main-inner -->
  </main>

  <!-- pdf.js from CDN (v3.11.174) — exposes global pdfjsLib -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
